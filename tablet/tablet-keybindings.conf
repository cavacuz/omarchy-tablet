# tablet keybindings — format: NAME=MODS+KEY
# Used by bindings.lua at load time and keybindings-apply.sh at runtime.
# MODS: SUPER, SHIFT, CTRL, ALT (combine with +, e.g. SUPER+SHIFT)
# KEY: Hyprland key name (e.g. T, B, P, F1)
# Comments and blank lines are ignored.
tablet_toggle=SUPER+SHIFT+T
osk_toggle=SUPER+B
pen_toggle=SUPER+SHIFT+P
